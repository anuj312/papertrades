<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Daily PnL</title>
  <style>
    body { font-family: system-ui, Arial; margin: 20px; }
    nav a { margin-right: 12px; }
    table { border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 8px 10px; }
    th { background: #f5f5f5; }
  </style>
</head>
<body>
  <nav>
    <a href="/trade">Trade</a>
    <a href="/dashboard">Performance</a>
    <a href="/daily-pnl">Daily PnL</a>
  </nav>

  <h2>Daily PnL (saved in DB)</h2>

  <div id="status">Loading...</div>

  <table id="tbl" style="display:none;">
    <thead>
      <tr>
        <th>Day (IST)</th>
        <th>Opening NetLiq</th>
        <th>Last NetLiq</th>
        <th>PnL</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    function fmt(x){ return (x ?? 0).toLocaleString(undefined,{maximumFractionDigits:2}); }

    async function load() {
      const r = await fetch("/api/daily-pnl");
      const data = await r.json();

      if (!data.ok) {
        document.getElementById("status").textContent = "Failed";
        return;
      }

      const rows = data.days || [];
      const tb = document.querySelector("#tbl tbody");
      tb.innerHTML = "";
      for (const d of rows) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${d.day}</td>
          <td>${fmt(d.opening_net_liq)}</td>
          <td>${fmt(d.last_net_liq)}</td>
          <td>${fmt(d.pnl)}</td>
          <td>${d.updated_at}</td>
        `;
        tb.appendChild(tr);
      }

      document.getElementById("status").textContent = rows.length ? "" : "No data yet.";
      document.getElementById("tbl").style.display = rows.length ? "" : "none";
    }
    load();
  </script>
</body>
</html>
