<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "PaperTrader (Demo)" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/styles.css" rel="stylesheet">
</head>

<body class="bg-app text-light">
<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary sticky-top"
     style="backdrop-filter: blur(10px); background: rgba(0,0,0,0.55);">
  <div class="container">

    <a class="navbar-brand fw-bold" href="/dashboard">PaperTrader</a>
    <span class="badge text-bg-warning ms-2">DEMO • No real orders</span>

    <div class="ms-auto d-flex align-items-center gap-2">

      {% if request.url.path == "/dashboard" %}
      <div id="dashSearchWrap" class="position-relative" style="width: 340px; max-width: 40vw;">
        <input
          id="dashSearchBox"
          class="form-control form-control-sm"
          placeholder="Search & trade (icici 1660 / infy / NFO:...)"
          autocomplete="off"
        />
        <div
          id="dashSearchResults"
          class="list-group position-absolute w-100 mt-2"
          style="z-index: 2000; max-height: 320px; overflow:auto; display:none;"
        ></div>
      </div>
      {% endif %}

      <a class="btn btn-outline-light btn-sm tab-btn {% if request.url.path.startswith('/dashboard') %}active{% endif %}"
         href="/dashboard">Dashboard</a>

      <a class="btn btn-outline-light btn-sm tab-btn {% if request.url.path.startswith('/daily-pnl') %}active{% endif %}"
         href="/daily-pnl">Daily PnL</a>

      <a class="btn btn-outline-light btn-sm tab-btn {% if request.url.path.startswith('/trade') %}active{% endif %}"
         href="/trade">Trade</a>

      <button class="btn btn-outline-danger btn-sm" id="btnReset" type="button">Reset</button>

      <span class="badge text-bg-{{ 'success' if market_open else 'secondary' }}">
        {{ 'Market Open' if market_open else 'Market Closed' }}
      </span>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>

<script>
  // Reset
  document.addEventListener("click", async (e) => {
    if (e.target && e.target.id === "btnReset") {
      if (!confirm("Reset demo account to ₹10,00,000 and clear positions/orders?")) return;
      const r = await fetch("/api/reset", { method: "POST" });
      if (r.ok) location.reload();
      else alert("Reset failed");
    }
  });

  // Dashboard navbar search: click outside to close (scroll fixed)
  (function initDashSearchUX(){
    const wrap = document.getElementById("dashSearchWrap");
    const box = document.getElementById("dashSearchBox");
    const results = document.getElementById("dashSearchResults");
    if (!wrap || !box || !results) return;

    function hideResults(){
      results.style.display = "none";
      results.innerHTML = "";
    }

    // Auto show/hide when app.js renders results
    const mo = new MutationObserver(() => {
      const hasItems = results.children && results.children.length > 0;
      results.style.display = hasItems ? "block" : "none";
    });
    mo.observe(results, { childList: true });

    // Close when clicking outside
    document.addEventListener("pointerdown", (e) => {
      if (!wrap.contains(e.target)) hideResults();
    });

    // ESC closes
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideResults();
    });

    // IMPORTANT FIX:
    // Do NOT use capture=true on scroll, otherwise scrolling the results list hides it.
    // If you still want to close on PAGE scroll, keep this (no capture):
    window.addEventListener("scroll", () => {
      // closes only when the window/page scrolls, not when dropdown itself scrolls
      hideResults();
    }, { passive: true });

    // Blur: if focus moves outside wrap, close
    box.addEventListener("blur", () => {
      setTimeout(() => {
        const active = document.activeElement;
        if (!wrap.contains(active)) hideResults();
      }, 0);
    });
  })();
</script>

{% block scripts %}{% endblock %}
</body>
</html>
