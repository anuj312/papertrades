<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "PaperTrader (Demo)" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/styles.css" rel="stylesheet">
</head>

<body class="bg-app text-light">
<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary sticky-top"
     style="backdrop-filter: blur(10px); background: rgba(0,0,0,0.55);">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/dashboard">PaperTrader</a>
    <span class="badge text-bg-warning ms-2">DEMO • No real orders</span>

    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="/trade">Trade</a>
      <a class="btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
      <button class="btn btn-outline-danger btn-sm" id="btnReset" type="button">Reset</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>

<script>
  // Reset demo (optional)
  document.addEventListener("click", async (e) => {
    if (e.target && e.target.id === "btnReset") {
      if (!confirm("Reset demo account to ₹100,000 and clear positions/orders?")) return;
      const r = await fetch("/api/reset", { method: "POST" });
      if (r.ok) location.reload();
      else alert("Reset failed");
    }
  });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
